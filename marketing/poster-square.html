<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, initial-scale=1, minimum-scale=1" />
<title>省钱猫 · 朋友圈方形海报</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; min-width: 1080px; overflow-x: hidden; }
  body {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: #f4ece2;
    color: #2b1d16;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  /* 纯方形 1080×1080，flex 列：头部 + 平台/本地 + 底部(二维码+联系) */
  .poster {
    width: 1080px; height: 1080px;
    display: flex; flex-direction: column;
  }

  /* ── 头部品牌区 ── */
  .hero {
    flex: none;
    background: linear-gradient(150deg, #ff8a3d 0%, #ff5630 55%, #f0332e 100%);
    padding: 36px 56px 32px;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute;
    right: -140px; bottom: -210px;
    width: 420px; height: 420px;
    border: 22px solid rgba(255,255,255,.10);
    border-radius: 50%;
  }
  .hero-top { display: flex; align-items: center; gap: 22px; position: relative; z-index: 2; }
  .hero-logo { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 10px 24px rgba(150,20,10,.35); }
  .hero-name { font-size: 56px; font-weight: 900; letter-spacing: 3px; }
  .hero-tag { margin-left: auto; font-size: 22px; font-weight: 800; color: #ff5630; background: #fff; padding: 8px 20px; border-radius: 999px; position: relative; z-index: 2; }
  .hero-slogan { margin-top: 18px; font-size: 34px; font-weight: 800; position: relative; z-index: 2; }
  .hero-sub { margin-top: 8px; font-size: 23px; opacity: .92; position: relative; z-index: 2; }

  /* ── 中部：四大平台 + 本地生活 双栏 ── */
  .mid {
    flex: 1;
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: 18px;
    padding: 20px 56px;
  }
  .panel {
    background: #fff;
    border-radius: 24px;
    padding: 24px 26px;
    box-shadow: 0 10px 26px rgba(120,60,20,.08);
    display: flex; flex-direction: column;
  }
  .panel-title { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 900; margin-bottom: 18px; }
  .panel-title .bar { width: 9px; height: 30px; border-radius: 5px; background: linear-gradient(#ff8a3d,#ff3b30); }

  /* 四大平台 2×2：grid 纵向均分、flex:1 撑满面板，消除下半部空白 */
  .plats { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; }
  .plat {
    border-radius: 16px;
    padding: 14px 18px;
    color: #fff;
    display: flex; align-items: center; gap: 14px;
  }
  .plat .p-ico {
    width: 52px; height: 52px; border-radius: 14px;
    background: rgba(255,255,255,.22);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900; flex: none;
  }
  .plat .p-name { font-size: 28px; font-weight: 800; }
  .plat .p-desc { font-size: 17px; opacity: .9; margin-top: 2px; }

  /* 本地生活标签 */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    border-radius: 999px;
    padding: 9px 22px;
    color: #fff; font-size: 23px; font-weight: 700;
  }
  .chip.ghost { background: #fff; color: #7a4a30; border: 2px solid #ffd9c2; }
  /* 右栏：标签从顶部自然排，说明文字推到面板底部，与左栏平台块底缘对齐 */
  .chips { align-content: flex-start; }
  .ll-note { margin-top: auto; padding-top: 16px; font-size: 19px; color: #a0765c; line-height: 1.5; }

  /* 代理一行 */
  .agent-line {
    flex: none;
    margin: 0 56px;
    background: linear-gradient(135deg,#5a3bf0,#8a2fd0);
    color: #fff;
    border-radius: 16px;
    padding: 14px 24px;
    font-size: 24px; font-weight: 800;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 8px 20px rgba(70,30,160,.25);
  }
  .agent-line b { color: #ffe27a; font-weight: 900; }
  .agent-line .right { margin-left: auto; font-size: 22px; opacity: .95; }

  /* ── 底部：二维码 + 联系 ── */
  .bottom {
    flex: none;
    margin: 18px 56px 22px;
    background: #fff;
    border-radius: 24px;
    padding: 20px 26px;
    display: flex; align-items: center; gap: 24px;
    box-shadow: 0 10px 26px rgba(120,60,20,.08);
  }
  .qr-img { width: 188px; height: 188px; border-radius: 16px; border: 4px solid #fff3ec; flex: none; }
  .contact { flex: 1; }
  .ct-row { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .ct-ico {
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(#ff8a3d,#ff3b30); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; flex: none;
  }
  .ct-tel { font-size: 38px; font-weight: 900; color: #ff3b30; letter-spacing: 1px; }
  .ct-lab { font-size: 19px; color: #a0765c; }
  .wx-row {
    display: flex; align-items: center; gap: 12px;
    background: #07c160; color: #fff;
    border-radius: 12px; padding: 10px 18px;
    font-size: 24px; font-weight: 800;
  }
  .wx-row .wlab { font-size: 19px; font-weight: 600; opacity: .92; margin-left: auto; }
</style>
</head>
<body>
<div class="poster">

  <!-- 头部 -->
  <div class="hero">
    <div class="hero-top">
      <img class="hero-logo" src="../h5/public/icons/icon-square-256.png" alt="省钱猫" />
      <div class="hero-name">省钱猫</div>
      <span class="hero-tag">领券 · 返利</span>
    </div>
    <div class="hero-slogan">四大平台购物返利 · 本地生活天天领券</div>
    <div class="hero-sub">买啥都先领券，下单再返现 —— 省下的就是赚到的</div>
  </div>

  <!-- 中部双栏 -->
  <div class="mid">
    <div class="panel">
      <div class="panel-title"><span class="bar"></span>四大平台返利</div>
      <div class="plats">
        <div class="plat" style="background:linear-gradient(135deg,#ff8200,#ff5000)">
          <span class="p-ico">淘</span><div><div class="p-name">淘宝</div><div class="p-desc">领券返利</div></div>
        </div>
        <div class="plat" style="background:linear-gradient(135deg,#e23a44,#c81623)">
          <span class="p-ico">京</span><div><div class="p-name">京东</div><div class="p-desc">全网好物</div></div>
        </div>
        <div class="plat" style="background:linear-gradient(135deg,#f64036,#e02e24)">
          <span class="p-ico">多</span><div><div class="p-name">拼多多</div><div class="p-desc">拼团再省</div></div>
        </div>
        <div class="plat" style="background:linear-gradient(135deg,#ff4d79,#ff2d52)">
          <span class="p-ico">唯</span><div><div class="p-name">唯品会</div><div class="p-desc">品牌特卖</div></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title"><span class="bar"></span>本地生活券</div>
      <div class="chips">
        <span class="chip" style="background:#ffb300">美团外卖</span>
        <span class="chip" style="background:#1296db">饿了么</span>
        <span class="chip" style="background:#ff6a00">淘宝闪购</span>
        <span class="chip" style="background:#ff6034">美团到店</span>
        <span class="chip ghost">酒店</span>
        <span class="chip ghost">电影</span>
        <span class="chip ghost">打车</span>
      </div>
      <div class="ll-note">外卖红包天天领，酒店电影打车，领券后直接下单立减。</div>
    </div>
  </div>

  <!-- 代理一行 -->
  <div class="agent-line">
    🎁 代理 <b>0元加入</b> · 自买省钱分享赚钱<span class="right">最高返佣 25% ›</span>
  </div>

  <!-- 底部 -->
  <div class="bottom">
    <img class="qr-img" src="qrcode-fanly.png" alt="扫码进省钱猫" />
    <div class="contact">
      <div class="ct-row">
        <span class="ct-ico">📞</span>
        <div>
          <div class="ct-tel">15873416463</div>
          <div class="ct-lab">咨询 / 合作 / 招商</div>
        </div>
      </div>
      <div class="wx-row">💬 微信同号<span class="wlab">扫码进群 / 申请代理</span></div>
    </div>
  </div>

</div>
</body>
</html>
