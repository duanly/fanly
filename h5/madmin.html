<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>运营中心</title>
    <meta name="theme-color" content="#ff4b3a" />
    <meta name="description" content="省钱猫运营中心，商品选品与运营管理后台。" />
    <link rel="icon" type="image/png" href="/icons/admin-icon-square-192.png" />

    <!-- iOS 图标：必须用正方形无圆角，iOS 会自动加圆角和光泽 -->
    <link rel="apple-touch-icon" href="/icons/admin-icon-square-180.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/admin-icon-square-120.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/admin-icon-square-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="运营中心" />

    <!-- 安卓/国产浏览器图标 -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/admin-icon-square-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/admin-icon-square-512.png" />

    <!-- 运营中心独立 PWA manifest：与主站 manifest id 不同，可同时安装到桌面 -->
    <link rel="manifest" href="/admin-manifest.json" />

    <!-- 国产浏览器"添加到桌面"兼容提示（UC/QQ/百度/华为/小米/OPPO/vivo） -->
    <link rel="apple-touch-icon-precomposed" href="/icons/admin-icon-square-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="运营中心" />

    <!-- QQ 浏览器/微信分享图标 -->
    <meta itemprop="image" content="/icons/admin-icon-square-256.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
