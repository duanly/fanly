<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 384" width="750" height="384">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4081"/>
      <stop offset="50%" stop-color="#f50057"/>
      <stop offset="100%" stop-color="#d500f9"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#fce4ec"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ff80ab" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff4081" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="75%" r="35%">
      <stop offset="0%" stop-color="#ea80fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d500f9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="750" height="384" fill="url(#bg)" rx="24"/>
  <rect width="750" height="384" fill="url(#glow1)" rx="24"/>
  <rect width="750" height="384" fill="url(#glow2)" rx="24"/>

  <!-- 装饰星星 -->
  <g fill="rgba(255,255,255,0.3)">
    <path d="M100,60 l2,6 l6,2 l-6,2 l-2,6 l-2,-6 l-6,-2 l6,-2 z"/>
    <path d="M680,80 l1.5,4.5 l4.5,1.5 l-4.5,1.5 l-1.5,4.5 l-1.5,-4.5 l-4.5,-1.5 l4.5,-1.5 z"/>
    <path d="M200,40 l1,3 l3,1 l-3,1 l-1,3 l-1,-3 l-3,-1 l3,-1 z"/>
    <path d="M600,320 l2.5,7.5 l7.5,2.5 l-7.5,2.5 l-2.5,7.5 l-2.5,-7.5 l-7.5,-2.5 l7.5,-2.5 z"/>
    <path d="M120,300 l1.5,4.5 l4.5,1.5 l-4.5,1.5 l-1.5,4.5 l-1.5,-4.5 l-4.5,-1.5 l4.5,-1.5 z"/>
  </g>

  <!-- 人物头像组（邀请好友概念） -->
  <g transform="translate(560, 120)">
    <!-- 背后光环 -->
    <circle cx="60" cy="60" r="90" fill="rgba(255,255,255,0.1)"/>
    <circle cx="60" cy="60" r="70" fill="rgba(255,255,255,0.08)"/>

    <!-- 三个头像圈 -->
    <circle cx="0" cy="40" r="36" fill="#fff" stroke="#ff80ab" stroke-width="3"/>
    <text x="0" y="50" text-anchor="middle" font-size="28">👤</text>

    <circle cx="60" cy="20" r="40" fill="#fff" stroke="#ea80fc" stroke-width="3"/>
    <text x="60" y="32" text-anchor="middle" font-size="32">👥</text>

    <circle cx="120" cy="45" r="34" fill="#fff" stroke="#ff4081" stroke-width="3"/>
    <text x="120" y="55" text-anchor="middle" font-size="26">👤</text>

    <!-- +号 -->
    <circle cx="150" cy="100" r="20" fill="#fff"/>
    <text x="150" y="108" text-anchor="middle" font-size="24" font-weight="bold" fill="#f50057">+</text>
  </g>

  <!-- 金币装饰 -->
  <g transform="translate(500, 280)">
    <circle cx="0" cy="0" r="22" fill="#ffd54f" stroke="#ffb300" stroke-width="2"/>
    <text x="0" y="7" text-anchor="middle" font-size="20" font-weight="bold" fill="#e65100">¥</text>
  </g>
  <g transform="translate(680, 260)">
    <circle cx="0" cy="0" r="18" fill="#ffd54f" stroke="#ffb300" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">¥</text>
  </g>

  <!-- 主文字区 -->
  <g transform="translate(50, 100)">
    <!-- 标签 -->
    <rect x="0" y="0" width="160" height="36" rx="18" fill="rgba(255,255,255,0.25)"/>
    <text x="80" y="24" text-anchor="middle" font-size="18" font-weight="600" fill="#fff">邀请好友</text>

    <!-- 大标题 -->
    <text x="0" y="90" font-size="56" font-weight="800" fill="#fff">躺赚佣金</text>

    <!-- 副标题 -->
    <text x="0" y="136" font-size="22" fill="rgba(255,255,255,0.85)">他下单你赚钱 · 长期分成 永久有效</text>

    <!-- 按钮 -->
    <rect x="0" y="170" width="180" height="56" rx="28" fill="url(#btn)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.15))"/>
    <text x="90" y="206" text-anchor="middle" font-size="22" font-weight="700" fill="#f50057">立即邀请 →</text>
  </g>
</svg>
