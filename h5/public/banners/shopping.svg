<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 384" width="750" height="384">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="50%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#af52de"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#ffe8e4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ff8a80" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="75%" r="35%">
      <stop offset="0%" stop-color="#ea80fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#af52de" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="750" height="384" fill="url(#bg)"/>
  <rect width="750" height="384" fill="url(#glow1)"/>
  <rect width="750" height="384" fill="url(#glow2)"/>

  <!-- 装饰圆圈 -->
  <circle cx="700" cy="40" r="100" fill="rgba(255,255,255,0.05)"/>
  <circle cx="680" cy="340" r="120" fill="rgba(255,255,255,0.04)"/>
  <circle cx="30" cy="60" r="50" fill="rgba(255,255,255,0.05)"/>

  <!-- 购物袋图标组 -->
  <g transform="translate(540, 60)">
    <!-- 光环 -->
    <circle cx="80" cy="120" r="120" fill="rgba(255,255,255,0.06)"/>
    <circle cx="80" cy="120" r="90" fill="rgba(255,255,255,0.04)"/>

    <!-- 大购物袋 -->
    <g transform="translate(50, 60)">
      <path d="M10,30 L10,120 Q10,130 20,130 L110,130 Q120,130 120,120 L120,30 Z" fill="#fff"/>
      <path d="M35,30 Q35,5 60,5 Q85,5 85,30" stroke="#fff" stroke-width="6" fill="none"/>
      <rect x="25" y="55" width="70" height="8" rx="4" fill="#ff3b30" opacity="0.2"/>
      <rect x="25" y="75" width="50" height="8" rx="4" fill="#ff3b30" opacity="0.2"/>
      <rect x="25" y="95" width="60" height="8" rx="4" fill="#ff3b30" opacity="0.2"/>
    </g>

    <!-- 小购物袋 -->
    <g transform="translate(150, 130)">
      <path d="M8,24 L8,90 Q8,98 16,98 L88,98 Q96,98 96,90 L96,24 Z" fill="#ffd54f"/>
      <path d="M28,24 Q28,4 48,4 Q68,4 68,24" stroke="#ffd54f" stroke-width="5" fill="none"/>
    </g>

    <!-- 红包/返利标签 -->
    <g transform="translate(30, 170)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="#ff3b30" stroke="#fff" stroke-width="2"/>
      <text x="32" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">返利</text>
      <text x="32" y="56" text-anchor="middle" font-size="18" font-weight="800" fill="#ffd54f">30%</text>
    </g>
  </g>

  <!-- 金币装饰 -->
  <g transform="translate(470, 50)">
    <circle cx="0" cy="0" r="18" fill="#ffd54f" stroke="#ffb300" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">¥</text>
  </g>
  <g transform="translate(700, 140)">
    <circle cx="0" cy="0" r="14" fill="#ffd54f" stroke="#ffb300" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">¥</text>
  </g>
  <g transform="translate(480, 280)">
    <circle cx="0" cy="0" r="20" fill="#ffd54f" stroke="#ffb300" stroke-width="2"/>
    <text x="0" y="7" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">¥</text>
  </g>

  <!-- 装饰点 -->
  <g fill="rgba(255,255,255,0.3)">
    <circle cx="100" cy="50" r="3"/>
    <circle cx="200" cy="30" r="2"/>
    <circle cx="320" cy="60" r="2.5"/>
    <circle cx="420" cy="40" r="2"/>
    <circle cx="120" cy="330" r="2.5"/>
    <circle cx="250" cy="350" r="2"/>
    <circle cx="380" cy="330" r="3"/>
  </g>

  <!-- 主文字区 -->
  <g transform="translate(50, 90)">
    <!-- 标签 -->
    <rect x="0" y="0" width="180" height="36" rx="18" fill="rgba(255,255,255,0.25)"/>
    <text x="90" y="24" text-anchor="middle" font-size="18" font-weight="600" fill="#fff">🛒 购物返利</text>

    <!-- 大标题 -->
    <text x="0" y="90" font-size="56" font-weight="800" fill="#fff">网购领券+返利，省了还要赚</text>

    <!-- 副标题 -->
    <text x="0" y="136" font-size="22" fill="rgba(255,255,255,0.9)">淘宝 · 京东 · 拼多多 · 唯品会</text>

    <!-- 亮点 -->
    <text x="0" y="172" font-size="18" fill="rgba(255,255,255,0.85)">
      隐藏优惠券 + <tspan fill="#ffd54f" font-weight="700" font-size="22">高额返利</tspan>
    </text>

    <!-- 按钮 -->
    <rect x="0" y="196" width="180" height="52" rx="26" fill="url(#btn)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.15))"/>
    <text x="90" y="229" text-anchor="middle" font-size="20" font-weight="700" fill="#ff3b30">去逛逛 →</text>
  </g>
</svg>
