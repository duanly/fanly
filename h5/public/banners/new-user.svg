<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 384" width="750" height="384">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="50%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#fff0e6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ffcc80" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#ff8a80" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="750" height="384" fill="url(#bg)" rx="24"/>
  <rect width="750" height="384" fill="url(#glow1)" rx="24"/>
  <rect width="750" height="384" fill="url(#glow2)" rx="24"/>

  <!-- 装饰圆圈 -->
  <circle cx="680" cy="60" r="80" fill="rgba(255,255,255,0.08)"/>
  <circle cx="710" cy="320" r="120" fill="rgba(255,255,255,0.05)"/>
  <circle cx="50" cy="340" r="50" fill="rgba(255,255,255,0.06)"/>

  <!-- 装饰点 -->
  <g fill="rgba(255,255,255,0.3)">
    <circle cx="100" cy="80" r="3"/>
    <circle cx="200" cy="50" r="2"/>
    <circle cx="300" cy="100" r="2.5"/>
    <circle cx="500" cy="60" r="2"/>
    <circle cx="600" cy="120" r="3"/>
    <circle cx="150" cy="320" r="2"/>
    <circle cx="420" cy="340" r="2.5"/>
  </g>

  <!-- 金币/钱币装饰 -->
  <g transform="translate(560, 80)">
    <circle cx="0" cy="0" r="36" fill="#ffd54f" stroke="#ffb300" stroke-width="3"/>
    <text x="0" y="8" text-anchor="middle" font-size="32" font-weight="bold" fill="#e65100">¥</text>
  </g>
  <g transform="translate(640, 160)">
    <circle cx="0" cy="0" r="24" fill="#ffd54f" stroke="#ffb300" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">¥</text>
  </g>
  <g transform="translate(520, 220)">
    <circle cx="0" cy="0" r="20" fill="#ffd54f" stroke="#ffb300" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">¥</text>
  </g>

  <!-- 主文字区 -->
  <g transform="translate(50, 100)">
    <!-- 标签 -->
    <rect x="0" y="0" width="140" height="36" rx="18" fill="rgba(255,255,255,0.25)"/>
    <text x="70" y="24" text-anchor="middle" font-size="18" font-weight="600" fill="#fff">新人专享</text>

    <!-- 大标题 -->
    <text x="0" y="90" font-size="56" font-weight="800" fill="#fff">首单返利翻倍</text>

    <!-- 副标题 -->
    <text x="0" y="136" font-size="22" fill="rgba(255,255,255,0.85)">注册即送 5 元红包 · 首单返利 200%</text>

    <!-- 按钮 -->
    <rect x="0" y="170" width="180" height="56" rx="28" fill="url(#btn)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.15))"/>
    <text x="90" y="206" text-anchor="middle" font-size="22" font-weight="700" fill="#ff3b30">立即领取 →</text>
  </g>
</svg>
