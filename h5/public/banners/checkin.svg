<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 384" width="750" height="384">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f43"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#fff3e0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff9f43" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#ff8a65" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="750" height="384" fill="url(#bg)" rx="24"/>
  <rect width="750" height="384" fill="url(#glow1)" rx="24"/>
  <rect width="750" height="384" fill="url(#glow2)" rx="24"/>

  <!-- 装饰圆圈 -->
  <circle cx="680" cy="50" r="90" fill="rgba(255,255,255,0.06)"/>
  <circle cx="720" cy="340" r="130" fill="rgba(255,255,255,0.04)"/>
  <circle cx="40" cy="320" r="60" fill="rgba(255,255,255,0.05)"/>

  <!-- 金币雨装饰 -->
  <g transform="translate(500, 40)">
    <circle cx="0" cy="0" r="26" fill="#ffd54f" stroke="#ffb300" stroke-width="2.5"/>
    <text x="0" y="9" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">¥</text>
  </g>
  <g transform="translate(600, 80)">
    <circle cx="0" cy="0" r="20" fill="#ffd54f" stroke="#ffb300" stroke-width="2"/>
    <text x="0" y="7" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">¥</text>
  </g>
  <g transform="translate(680, 180)">
    <circle cx="0" cy="0" r="30" fill="#ffd54f" stroke="#ffb300" stroke-width="2.5"/>
    <text x="0" y="10" text-anchor="middle" font-size="26" font-weight="bold" fill="#e65100">¥</text>
  </g>
  <g transform="translate(540, 180)">
    <circle cx="0" cy="0" r="16" fill="#ffd54f" stroke="#ffb300" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">¥</text>
  </g>
  <g transform="translate(620, 290)">
    <circle cx="0" cy="0" r="22" fill="#ffd54f" stroke="#ffb300" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle" font-size="20" font-weight="bold" fill="#e65100">¥</text>
  </g>
  <g transform="translate(500, 300)">
    <circle cx="0" cy="0" r="14" fill="#ffd54f" stroke="#ffb300" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">¥</text>
  </g>

  <!-- 日历图标 -->
  <g transform="translate(580, 190)">
    <rect x="-36" y="-40" width="72" height="80" rx="10" fill="#fff" stroke="#ffb300" stroke-width="2"/>
    <rect x="-36" y="-40" width="72" height="22" rx="10" fill="#ff6b35"/>
    <rect x="-36" y="-28" width="72" height="10" fill="#ff6b35"/>
    <circle cx="-18" cy="-36" r="3" fill="#fff"/>
    <circle cx="18" cy="-36" r="3" fill="#fff"/>
    <!-- 日期数字 -->
    <text x="0" y="18" text-anchor="middle" font-size="32" font-weight="800" fill="#ff6b35">7</text>
    <!-- 对勾 -->
    <path d="M-12,22 L-2,32 L14,16" stroke="#07c160" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 装饰点 -->
  <g fill="rgba(255,255,255,0.3)">
    <circle cx="80" cy="50" r="3"/>
    <circle cx="180" cy="30" r="2"/>
    <circle cx="280" cy="70" r="2.5"/>
    <circle cx="380" cy="40" r="2"/>
    <circle cx="460" cy="60" r="3"/>
    <circle cx="100" cy="330" r="2.5"/>
    <circle cx="200" cy="350" r="2"/>
    <circle cx="380" cy="340" r="2.5"/>
  </g>

  <!-- 主文字区 -->
  <g transform="translate(50, 100)">
    <!-- 标签 -->
    <rect x="0" y="0" width="140" height="36" rx="18" fill="rgba(255,255,255,0.25)"/>
    <text x="70" y="24" text-anchor="middle" font-size="18" font-weight="600" fill="#fff">每日签到</text>

    <!-- 大标题 -->
    <text x="0" y="90" font-size="56" font-weight="800" fill="#fff">天天签到领金币</text>

    <!-- 副标题 -->
    <text x="0" y="136" font-size="22" fill="rgba(255,255,255,0.9)">连续签到 7 天 · 额外奖励翻倍</text>

    <!-- 金币数提示 -->
    <text x="0" y="170" font-size="18" fill="rgba(255,255,255,0.8)">
      <tspan fill="#ffd54f" font-weight="700">+30</tspan> 金币/天  ·  攒够直接提现
    </text>

    <!-- 按钮 -->
    <rect x="0" y="196" width="170" height="52" rx="26" fill="url(#btn)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.15))"/>
    <text x="85" y="229" text-anchor="middle" font-size="20" font-weight="700" fill="#ff6b35">立即签到 →</text>
  </g>
</svg>
