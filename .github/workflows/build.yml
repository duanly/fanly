name: 构建并推送镜像

on:
  push:
    branches: [main]
    tags: ['v*']
    # 只改文档不触发构建
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

env:
  # 默认推 GHCR，用内置 GITHUB_TOKEN，不用配任何 Secret。
  # 要换阿里云 ACR：把 REGISTRY 改成 ACR 地址、IMAGE_NAMESPACE 改成命名空间，
  # 再配 ACR_USERNAME / ACR_PASSWORD 两个 Secret（下面登录步骤会自动切换）。
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # 推 GHCR 必需
    strategy:
      # 一个挂了另一个继续，省得白等
      fail-fast: false
      matrix:
        include:
          - name: server
            context: ./server
            dockerfile: ./server/Dockerfile
          - name: web
            context: .
            dockerfile: ./deploy/Dockerfile.web

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # GHCR 用内置 token；换成别家时配了 ACR_USERNAME 就走那套
          username: ${{ secrets.ACR_USERNAME || github.actor }}
          password: ${{ secrets.ACR_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR 要求全小写
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/fanly-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # 腾讯云 CVM 是 amd64
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 用 GitHub 的缓存，第二次构建快很多
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: 输出镜像地址
        run: |
          echo "### fanly-${{ matrix.name }} 已推送" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
