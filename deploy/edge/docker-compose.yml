# 共享 Caddy 入口。整台机器只跑这一份，占住 80/443。
#
#   docker network create edge     # 只做一次
#   cp .env.example .env           # 填 ACME_EMAIL
#   docker compose up -d
#
# 证书在 caddy-data 卷里，别删——删了重签会撞 Let's Encrypt 频率限制。

services:
  caddy:
    image: caddy:2-alpine
    container_name: edge-caddy
    restart: always
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./conf.d:/etc/caddy/conf.d:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    networks: [edge]

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:

networks:
  edge:
    external: true
    name: edge
