name: fanli
description: 省钱猫 · 买啥都返现（淘宝/京东/拼多多/唯品会 CPS 导购）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 状态管理
  flutter_riverpod: ^2.5.1
  # 路由
  go_router: ^14.2.0
  # 网络
  dio: ^5.5.0
  # Token 安全存储（iOS Keychain / Android Keystore）
  flutter_secure_storage: ^9.2.2
  # 提示
  fluttertoast: ^8.2.6
  # 网络图片缓存
  cached_network_image: ^3.4.0
  # SVG（图形验证码、矢量图标）
  flutter_svg: ^2.0.10
  # 唤起外部购物 App / 浏览器
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
